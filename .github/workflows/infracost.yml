name: Shift-Left FinOps (Infracost)

on:
  pull_request:
    types: [opened, synchronize, closed]

jobs:
  infracost_cost_estimation:
    name: Run Cost Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        if: github.event.action != 'closed'
        with:
          path: head

      - name: Checkout base branch
        uses: actions/checkout@v4
        if: github.event.action != 'closed'
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: base

      - name: Generate Infracost Report
        uses: infracost/actions/diff@v4
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
          base-path: base
          head-path: head
          path-to-infracost-json: infracost-result.json

      - name: Enforce FinOps Budget Gate
        run: |
          # Extract the total cost difference using jq
          DIFF_COST=$(jq -r '.diffTotalMonthlyCost // 0' infracost-result.json)
          echo "The PR changes the monthly bill by: \$$DIFF_COST"
          
          # If the cost increase is greater than $50, fail the pipeline
          if (( $(echo "$DIFF_COST > 50.00" | bc -l) )); then
            echo "❌ FinOps Guardrail Violation: Cost increase (\$$DIFF_COST) exceeds the monthly limit of $50!"
            exit 1
          else
            echo "✅ Budget check passed."
          fi