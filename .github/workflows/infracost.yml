name: Shift-Left FinOps (Infracost)

on:
  pull_request:
    types: [opened, synchronize, closed]

jobs:
  infracost_cost_estimation:
    name: Run Cost Analysis
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          path: head

      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: base

      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate Infracost Baseline
        run: infracost breakdown --path base --format json --out-file infracost-base.json

      - name: Generate Infracost Diff Report
        run: infracost diff --path head --compare-to infracost-base.json --format json --out-file infracost-result.json

      - name: Enforce FinOps Budget Gate
        run: |
          # Extract the total cost difference using jq
          DIFF_COST=$(jq -r '.diffTotalMonthlyCost // 0' infracost-result.json)
          echo "The PR changes the monthly bill by: \$$DIFF_COST"
          
          # If the cost increase is greater than $50, fail the pipeline
          if (( $(echo "$DIFF_COST > 50.00" | bc -l) )); then
            echo "❌ FinOps Guardrail Violation: Cost increase (\$$DIFF_COST) exceeds the monthly limit of $50!"
            exit 1
          else
            echo "✅ Budget check passed."
          fi